[package]
name = "scour"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Local search for one person"

[[bin]]
name = "scour"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }
chrono = { version = "0.4", default-features = false, features = ["now"] }
axum = "0.8"
wreq = { version = "0.16", features = ["json", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = { version = "0.2", features = ["emulation", "emulation-compression"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
url = "2"
base64 = "0.22"
rmcp = { version = "3.12", features = ["server", "macros", "transport-streamable-http-server"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }
